--- # node_npm

##################################################################################
# Node.js + npm
##################################################################################

####################################
# Get/set vars
####################################

- name: Get package/environment information
  ansible.builtin.set_fact:
    package: "{{ node_npm.package }}"

- name: Set task variables
  ansible.builtin.set_fact:
    package_name: "{{ package.info.name }}"
    package_version: "{{ package.info.version }}"
    package_arch: "{{ package.src.arch }}"
    package_base_url: "{{ package.src.base_url }}"
    package_checksum: "{{ package.src.checksum }}"
    base_path: "{{ share_path }}/software/{{ package.info.name }}/{{ package.info.version }}"

- name: Set download link
  ansible.builtin.set_fact:
    package_url: "{{ package_base_url }}/v{{ package_version }}/node-v{{ package_version }}-linux-{{ package_arch }}.tar.xz"

- name: Set expected paths
  ansible.builtin.set_fact:
    expected_binary: "{{ base_path }}/install/bin/node"
    expected_binary_npm: "{{ base_path }}/install/bin/npm"

- name: Check if expected files exist for idempotency (binary)
  ansible.builtin.stat:
    path: "{{ expected_binary }}"
  register: check_exists_expected_binary

- name: Check if expected files exist for idempotency (npm binary)
  ansible.builtin.stat:
    path: "{{ expected_binary_npm }}"
  register: check_exists_expected_binary_npm

####################################
# Download package
####################################

- name: Create temporary directory to download package archive
  ansible.builtin.tempfile:
    state: directory
    suffix: build
  register: temp_dir
  when:
    - not check_exists_expected_binary.stat.exists
    - not check_exists_expected_binary_npm.stat.exists

- name: Download the package archive with SHA256 verification
  ansible.builtin.get_url:
    url: "{{ package_url }}"
    dest: "{{ temp_dir.path }}/{{ package_url | basename }}"
    checksum: "{{ package_checksum }}"
  when:
    - not check_exists_expected_binary.stat.exists
    - not check_exists_expected_binary_npm.stat.exists

####################################
# Extract / install package
####################################

- name: Create package install location
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ package.owner.user }}"
    group: "{{ package.owner.group }}"
    mode: u=rwX,g=rX,o=rX
  loop:
    - "{{ base_path }}/install"

- name: Extract and install the package
  ansible.builtin.unarchive:
    src: "{{ temp_dir.path }}/{{ package_url | basename }}"
    dest: "{{ base_path }}/install"
    creates: "{{ expected_binary }}"
    owner: "{{ package.owner.user }}"
    group: "{{ package.owner.group }}"
    remote_src: yes
    extra_opts: [--strip-components=1,--no-same-owner]
  when:
    - not check_exists_expected_binary.stat.exists
    - not check_exists_expected_binary_npm.stat.exists

####################################
# Cleanup
####################################

- name: Cleanup temporary directory
  ansible.builtin.file:
    path: "{{ temp_dir.path }}"
    state: absent
  when: temp_dir.path is defined

####################################
# Configure npm's shared global prefix
####################################

- name: Create npm global prefix directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ package.owner.user }}"
    group: "{{ package.owner.group }}"
    mode: u=rwX,g=rX,o=rX
  loop:
    - "{{ npm_global_prefix }}"
    - "{{ npm_global_prefix }}/bin"
    - "{{ npm_global_prefix }}/cache"

- name: Symlink node/npm binaries into the npm global prefix
  ansible.builtin.file:
    src: "{{ base_path }}/install/bin/{{ item }}"
    dest: "{{ npm_global_prefix }}/bin/{{ item }}"
    owner: "{{ package.owner.user }}"
    group: "{{ package.owner.group }}"
    state: link
  loop:
    - "node"
    - "npm"
    - "npx"
    - "corepack"

####################################
# Install module
####################################

- name: Install module
  ansible.builtin.template:
    src: templates/modulefile.j2
    dest: "{{ base_path }}/module.lua"
    owner: "{{ package.owner.user }}"
    group: "{{ package.owner.group }}"
    mode: u=rw,g=r,o=r
  vars:
    module:
      module:
        category: "Module"
        vars:
          - module_name: "'{{ package.info.name }}'"
          - module_version: "'{{ package.info.version }}'"
          - module_description: "'{{ package.module.description }}'"
          - module_help: "'{{ package.module.help }}'"
        funcs:
          - whatis: [ module_description ]
          - help: [ module_help ]
      conflicts:
        category: "Conflicts"
        funcs:
          - conflict: [ module_name ]
      environment:
        category: "Environment"
        funcs:
          - setenv: [ "'NPM_CONFIG_PREFIX'" , "'{{ npm_global_prefix }}'" ]
          - setenv: [ "'NPM_CONFIG_CACHE'" , "'{{ npm_global_prefix }}/cache'" ]
      paths:
        category: "Paths"
        funcs:
          - prepend_path: [ "'PATH'" , "'{{ npm_global_prefix }}/bin'" ]

- name: Link module - ensure directory is present
  ansible.builtin.file:
    path: "{{ share_path }}/modulefiles/{{ package_name }}/"
    state: directory
    owner: "{{ package.owner.user }}"
    group: "{{ package.owner.group }}"
    mode: u=rwX,g=rX,o=rX

- name: Link module - create symlink
  ansible.builtin.file:
    src: "{{ base_path }}/module.lua"
    dest: "{{ share_path }}/modulefiles/{{ package_name }}/{{ package_version }}.lua"
    owner: "{{ package.owner.user }}"
    group: "{{ package.owner.group }}"
    state: link
